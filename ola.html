<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Programa OLA | Portal Promotores</title>
    <script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { colors: { oppoblack: '#000000', oppogreen: '#05B670', oppolight: '#f5f5f7', olablue: '#0055ff' } } } }</script>
    <style id="dark-theme-style">
        body.dark-mode { background-color: #121212 !important; color: #e0e0e0 !important; }
        body.dark-mode .bg-white { background-color: #1e1e1e !important; border-color: #2d2d2d !important; }
        body.dark-mode .text-gray-800 { color: #ffffff !important; }
        body.dark-mode .text-gray-700 { color: #dddddd !important; }
        body.dark-mode .text-gray-500 { color: #a0a0a0 !important; }
        body.dark-mode .bg-gray-50 { background-color: #252525 !important; }
        body.dark-mode .bg-gray-100 { background-color: #2d2d2d !important; }
        body.dark-mode .border-b, body.dark-mode .border-gray-100 { border-color: #333 !important; }
        body.dark-mode .glass-card { background-color: #1e1e1e !important; border-color: #333 !important; }
    </style>
    <style>
        body{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#f5f5f7;}
        /* Animacion simple para el modal */
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-animate { animation: zoomIn 0.3s ease-out forwards; }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6D6ZC9K790"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6D6ZC9K790');
    </script>
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            updateThemeIcon();
        }
        function initTheme() {
            if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            if(icon) {
                if(document.body.classList.contains('dark-mode')) {
                    icon.className = 'fas fa-sun text-yellow-400';
                } else {
                    icon.className = 'fas fa-moon text-gray-600 dark:text-yellow-400';
                }
            }
        }
        document.addEventListener('DOMContentLoaded', initTheme);
    </script>
</head>
<body class="pb-24 text-gray-800 transition-colors duration-300">
    <!-- NAVBAR -->
    <div class="bg-white shadow-sm sticky top-0 z-40 border-b border-gray-100">

            </div>
            <button onclick="toggleDarkMode()" class="w-10 h-10 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center transition">
                <i id="themeIcon" class="fas fa-moon text-gray-600 dark:text-yellow-400"></i>

    </div>

    <main class="max-w-4xl mx-auto px-4 mt-8">

        </div>

        <!-- CADENAS COMERCIALES -->

                <button onclick="openImage('Recursos/ola/coppel att.jpg')" class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between hover:shadow-md hover:border-blue-200 transition group">
                    <div class="flex items-center"><div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center mr-3 text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition"><i class="fas fa-mobile-alt"></i></div><span class="font-bold">AT&T</span></div>

                <button onclick="openImage('Recursos/ola/coppel movistar.jpg')" class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between hover:shadow-md hover:border-blue-200 transition group">

        <!-- ELEKTRA -->

    </main>

    <!-- MODAL VISOR DE IMAGENES -->
    <div id="imageModal" class="fixed inset-0 bg-black/90 z-[100] hidden flex-col items-center justify-center p-4 backdrop-blur-md">
        <!-- Close Button -->
        <button onclick="closeImage()" class="absolute top-6 right-6 text-white/70 hover:text-white text-4xl p-2 w-12 h-12 flex items-center justify-center z-50 transition"><i class="fas fa-times"></i></button>
        
        <!-- Image Container with zoom ability setup -->
        <div class="w-full max-w-4xl max-h-[90vh] flex items-center justify-center modal-animate relative">
            <img id="modalImg" src="" alt="Puntos OLA" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl">
        </div>
        
        <!-- Hint Text -->
        <div class="absolute bottom-6 text-white/60 text-sm">Pellizca la pantalla para hacer zoom</div>
    </div>

    <script>
        function openImage(srcPath) {
            document.getElementById('modalImg').src = srcPath;
            const modal = document.getElementById('imageModal');
            modal.classList.remove('hidden'); 
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden'; // Evitar scroll de fondo
        }
        function closeImage() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('hidden'); 
            modal.classList.remove('flex');
            setTimeout(() => { document.getElementById('modalImg').src = ''; }, 300); // limpiar src tras cerrar
            document.body.style.overflow = 'auto'; // Restaurar scroll
        }
        
        // Cerrar al hacer clic fuera de la imagen
        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeImage();
            }
        });
    </script>
</body>
</html>
