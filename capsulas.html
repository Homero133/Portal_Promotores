<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cápsulas y Capacitaciones | Portal Promotores</title>
    <script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { colors: { oppoblack: '#000000', oppogreen: '#05B670', oppolight: '#f5f5f7' } } } }</script>
    <style id="dark-theme-style">
        body.dark-mode { background-color: #121212 !important; color: #e0e0e0 !important; }
        body.dark-mode .bg-white { background-color: #1e1e1e !important; border-color: #2d2d2d !important; }
        body.dark-mode .text-gray-800 { color: #ffffff !important; }
        body.dark-mode .text-gray-700 { color: #dddddd !important; }
        body.dark-mode .text-gray-500 { color: #a0a0a0 !important; }
        body.dark-mode .bg-gray-100 { background-color: #2d2d2d !important; }
        body.dark-mode .border-b { border-color: #333 !important; }
        body.dark-mode .glass-card { background-color: #1e1e1e !important; border-color: #333 !important; }
    </style>
    <style>
        body{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#f5f5f7;}
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6D6ZC9K790"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6D6ZC9K790');
    </script>
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            updateThemeIcon();
        }
        function initTheme() {
            if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            if(icon) {
                if(document.body.classList.contains('dark-mode')) {
                    icon.className = 'fas fa-sun text-yellow-400';
                } else {
                    icon.className = 'fas fa-moon text-gray-600 dark:text-yellow-400';
                }
            }
        }
        document.addEventListener('DOMContentLoaded', initTheme);
    </script>
</head>
<body class="pb-24 text-gray-800 transition-colors duration-300">
    <div class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center">
                <a href="index.html" class="mr-4 text-xl p-2 -ml-2 rounded-full hover:bg-gray-100 text-gray-500"><i class="fas fa-arrow-left"></i></a>
                <h1 class="text-xl md:text-2xl font-bold">C&aacute;psulas y Capacitaciones</h1>
            </div>
            <button onclick="toggleDarkMode()" class="w-10 h-10 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center transition">
                <i id="themeIcon" class="fas fa-moon text-gray-600 dark:text-yellow-400"></i>
            </button>
        </div>
    </div>
    <main class="max-w-4xl mx-auto px-4 mt-8">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-6">
            <!-- Video 1 -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col overflow-hidden group cursor-pointer hover:shadow-lg transition duration-300" onclick="openVideo('wuge6mbhoqA')">
                <div class="relative w-full aspect-video bg-gray-200 overflow-hidden">
                    <img src="https://img.youtube.com/vi/wuge6mbhoqA/hqdefault.jpg" alt="Miniatura" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                    <div class="absolute inset-0 bg-black/10 flex items-center justify-center group-hover:bg-black/30 transition duration-300"><div class="w-14 h-14 bg-white/95 rounded-full flex items-center justify-center shadow-xl text-red-600 text-xl transform group-hover:scale-110 transition duration-300"><i class="fas fa-play ml-1"></i></div></div>
                </div>
                <div class="p-5">
                    <h4 class="font-bold text-gray-800 text-lg leading-tight">Domina el Efecto WOW</h4>
                    <p class="text-sm text-gray-500 mt-2 leading-relaxed">Aprende t&eacute;cnicas infalibles para sorprender a tus clientes y cerrar m&aacute;s ventas en piso.</p>
                </div>
            </div>

            <!-- Video 2 -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col overflow-hidden group cursor-pointer hover:shadow-lg transition duration-300" onclick="openVideo('4J_a1p5ZGNY')">
                <div class="relative w-full aspect-video bg-gray-200 overflow-hidden">
                    <img src="https://img.youtube.com/vi/4J_a1p5ZGNY/hqdefault.jpg" alt="Miniatura" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                    <div class="absolute inset-0 bg-black/10 flex items-center justify-center group-hover:bg-black/30 transition duration-300"><div class="w-14 h-14 bg-white/95 rounded-full flex items-center justify-center shadow-xl text-red-600 text-xl transform group-hover:scale-110 transition duration-300"><i class="fas fa-play ml-1"></i></div></div>
                </div>
                <div class="p-5">
                    <h4 class="font-bold text-gray-800 text-lg leading-tight">OPPO Bubble</h4>
                    <p class="text-sm text-gray-500 mt-2 leading-relaxed">Descubre los secretos y casos de uso pr&aacute;cticos de la herramienta OPPO Bubble.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL REPRODUCTOR -->
    <div id="videoModal" class="fixed inset-0 bg-black/95 z-[100] hidden flex-col items-center justify-center p-4 backdrop-blur-sm">
        <button onclick="closeModal()" class="absolute top-6 right-6 text-white/70 hover:text-white text-4xl p-2 w-12 h-12 flex items-center justify-center"><i class="fas fa-times"></i></button>
        <div class="w-full max-w-[380px] aspect-[9/16] bg-black rounded-2xl overflow-hidden relative shadow-2xl">
            <iframe id="modalIframe" src="" class="absolute top-0 left-0 w-full h-full" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
    </div>
    <script>
        function openVideo(id) {
            document.getElementById('modalIframe').src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1';
            const modal = document.getElementById('videoModal');
            modal.classList.remove('hidden'); modal.classList.add('flex');
        }
        function closeModal() {
            const modal = document.getElementById('videoModal');
            modal.classList.add('hidden'); modal.classList.remove('flex');
            document.getElementById('modalIframe').src = '';
        }
    </script>
</body>
</html>
